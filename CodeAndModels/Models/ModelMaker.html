<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBJ & MTL to MIF Converter (4-Model)</title>
  <style>
    body{font-family:system-ui;background:#0f0f14;color:#f3f3f5;max-width:1000px;margin:2rem auto;padding:0 1rem;line-height:1.5}
    h2{color:#a5b4fc;margin-bottom:.25rem}
    p.desc{color:#9ca3af;margin-top:0}
    code{background:#1e1e28;padding:2px 6px;border-radius:4px;color:#c7d2fe}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
    .slot{background:#141418;border-radius:8px;padding:14px}
    .slot h3{margin:0 0 .5rem 0;color:#a5b4fc;font-size:1rem}
    .drop-zone{border:2px dashed #4f46e5;border-radius:8px;padding:28px 14px;text-align:center;background:#18181c;cursor:pointer;transition:all .2s ease}
    .drop-zone.hover{background:#232338;border-color:#6366f1}
    .drop-zone p{margin:0;font-size:.9rem;color:#818cf8;font-weight:500}
    .drop-zone span{font-size:.75rem;color:#6b7280;display:block;margin-top:4px}
    input[type=file]{display:none}
    .loaded{margin-top:.5rem;font-size:.8rem;color:#86efac;min-height:1.2em;white-space:pre-line}
    .btn{margin-top:1.4rem;padding:.7rem 1.4rem;background:#4f46e5;color:white;border:none;border-radius:6px;cursor:pointer;font-size:1rem}
    .btn:hover{background:#6366f1}
    .btn:disabled{background:#333;cursor:not-allowed}
    #status{margin-top:1rem;padding:.7rem;background:#141418;border-radius:6px;white-space:pre-line;font-family:monospace;font-size:.85rem;min-height:2em;color:#d1d5db}
    .note{margin-top:.5rem;font-size:.8rem;color:#9ca3af}
  </style>
</head>
<body>
  <h2>OBJ/MTL to MIF Converter — 4 Models</h2>
  <p class="desc">Drop <code>.obj</code>+<code>.mtl</code> pairs into slots. Empty slots cascade — slot 2 uses slot 1 if empty, slot 3 uses last filled, and so on.</p>

  <div class="row" id="slots"></div>

  <button class="btn" id="genBtn" disabled>Generate MIF</button>
  <p class="note">Output: <code>ramInit.mif</code> — DEPTH=8192, four models packed into RAM.</p>
  <div id="status">Awaiting Model 1…</div>

<script>
  const N = 4;
  const slots = [];
  for (let i = 0; i < N; i++) slots.push({idx:i, obj:null, mtl:null, V:null, F:null, mtlDict:null, name:''});

  // Build slot DOM
  const slotsEl = document.getElementById('slots');
  slots.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `<h3>Model ${i+1}${i>0?' <span style="color:#6b7280;font-weight:normal">(optional)</span>':''}</h3>
      <div class="drop-zone" id="dz${i}">
        <p>Drop .OBJ &amp; .MTL here</p>
        <span>${i===0?'or click to browse':'or leave empty to cascade'}</span>
        <input type="file" id="fi${i}" multiple accept=".obj,.mtl">
      </div>
      <div class="loaded" id="loaded${i}"></div>`;
    slotsEl.appendChild(div);
  });

  slots.forEach((s, i) => {
    const dz = document.getElementById('dz'+i);
    const fi = document.getElementById('fi'+i);
    dz.addEventListener('click', () => fi.click());
    ['dragenter','dragover'].forEach(n => dz.addEventListener(n, e => {e.preventDefault();e.stopPropagation();dz.classList.add('hover');}));
    ['dragleave','drop'].forEach(n => dz.addEventListener(n, e => {e.preventDefault();e.stopPropagation();dz.classList.remove('hover');}));
    fi.addEventListener('change', () => handleFiles(fi.files, i));
    dz.addEventListener('drop', e => handleFiles(e.dataTransfer.files, i));
  });

  const statusEl = document.getElementById('status');
  const genBtn   = document.getElementById('genBtn');

  async function handleFiles(files, idx){
    const s = slots[idx];
    s.obj = null; s.mtl = null;
    for (const f of files){
      if (f.name.toLowerCase().endsWith('.obj')) s.obj = f;
      else if (f.name.toLowerCase().endsWith('.mtl')) s.mtl = f;
    }
    if (!s.obj){
      document.getElementById('loaded'+idx).textContent = 'No .obj found';
      s.V = null; s.F = null; s.mtlDict = null; s.name = '';
      updateBtn();
      return;
    }
    try {
      const objText = await s.obj.text();
      const mtlText = s.mtl ? await s.mtl.text() : '';
      s.mtlDict = parseMTL(mtlText);
      const parsed = parseOBJ(objText);
      s.V = parsed.V; s.F = parsed.F;
      s.name = s.obj.name.replace(/\.obj$/i,'');
      document.getElementById('loaded'+idx).textContent =
        `${s.obj.name}: ${s.V.length}v, ${s.F.length}t` + (s.mtl ? `\n${s.mtl.name}` : '\n(no MTL — default gray)');
      updateBtn();
      updateStatus();
    } catch(err){
      document.getElementById('loaded'+idx).textContent = 'Error: ' + err.message;
      s.V = null; s.F = null; s.mtlDict = null;
      updateBtn();
    }
  }
  function updateBtn(){ genBtn.disabled = !slots[0].V; }
  function updateStatus(){
    const filled = slots.map((s,i) => s.V ? (i+1) : null).filter(x=>x);
    const missing = slots.map((s,i) => s.V ? null : (i+1)).filter(x=>x);
    let msg = `Filled: ${filled.length===0?'none':filled.join(', ')}`;
    if (missing.length) msg += ` | Empty (will cascade): ${missing.join(', ')}`;
    statusEl.textContent = msg;
  }

  function parseMTL(text){
    const cols = {}; let cur = null;
    for (let line of text.split(/\r?\n/)){
      line = line.trim(); if (!line || line.startsWith('#')) continue;
      const t = line.split(/\s+/);
      if (t[0]==='newmtl') cur = t[1];
      else if (t[0]==='Kd' && cur){
        const r = Math.max(0, Math.min(15, Math.round(parseFloat(t[1])*15)));
        const g = Math.max(0, Math.min(15, Math.round(parseFloat(t[2])*15)));
        const b = Math.max(0, Math.min(15, Math.round(parseFloat(t[3])*15)));
        cols[cur] = (b<<8) | (g<<4) | r;
      }
    }
    return cols;
  }
  function parseOBJ(text, coordMax=255){
    const V=[], F=[]; let mat='default';
    for (let line of text.split(/\r?\n/)){
      line = line.trim(); if (!line || line.startsWith('#')) continue;
      const t = line.split(/\s+/);
      if (t[0]==='v') V.push([parseFloat(t[1]),parseFloat(t[2]),parseFloat(t[3])]);
      else if (t[0]==='usemtl') mat = t[1];
      else if (t[0]==='f'){
        const idx = t.slice(1).map(p => parseInt(p.split('/')[0])-1);
        for (let k=1; k<idx.length-1; k++) F.push([idx[0], idx[k], idx[k+1], mat]);
      }
    }
    if (V.length===0) throw new Error('No vertices found.');
    const cx = [0,1,2].map(i => (Math.min(...V.map(v=>v[i])) + Math.max(...V.map(v=>v[i])))/2);
    let r = Math.max(...V.map(v => Math.max(...[0,1,2].map(i => Math.abs(v[i]-cx[i])))));
    if (r===0) r = 1;
    return { V: V.map(v => [0,1,2].map(i => Math.round(((v[i]-cx[i])/r)*coordMax))), F };
  }
  function packV(v){ return ((v[0]&0x3FF)|((v[1]&0x3FF)<<10)|((v[2]&0x3FF)<<20))>>>0; }
  function packT(f){ return ((f[0]&0xFF)|((f[1]&0xFF)<<8)|((f[2]&0xFF)<<16))>>>0; }
  function colourOf(mat, mtlDict){ return mtlDict.hasOwnProperty(mat) ? mtlDict[mat] : 0x888; }

  function writeModel(mem, base, V, F, mtlDict){
    mem.set(base, V.length>>>0);
    mem.set(base+1, F.length>>>0);
    for (let i=0; i<V.length; i++) mem.set(base+2+i, packV(V[i]));
    for (let i=0; i<F.length; i++) mem.set(base+2+V.length+i, packT(F[i]));
    for (let i=0; i<F.length; i++) mem.set(base+2+V.length+F.length+i, colourOf(F[i][3], mtlDict)>>>0);
  }

  /* word-address base per slot; matches hw.h */
  const BASES = [1200, 2000, 2800, 3600];

  function buildMIF(){
    const DEPTH = 8192;
    const mem = new Map();
    for (let k=0; k<65; k++){
      const val = Math.round(256*Math.sin(2*Math.PI*k/256)) & 0xFFFFFFFF;
      mem.set(1128+k, val>>>0);
    }
    /* Cascade: each empty slot inherits from the last filled one before it. */
    let last = slots[0];
    for (let i = 0; i < N; i++){
      if (slots[i].V) last = slots[i];
      writeModel(mem, BASES[i], last.V, last.F, last.mtlDict);
    }

    const lines = ['DEPTH = 8192;','WIDTH = 32;','ADDRESS_RADIX = DEC;','DATA_RADIX = HEX;','CONTENT BEGIN'];
    const hex = v => (v>>>0).toString(16).toUpperCase().padStart(8,'0');
    // Emit set values, coalescing zero runs
    let prev = -1;
    for (let a = 0; a < DEPTH; a++){
      const v = mem.has(a) ? mem.get(a) : 0;
      if (v !== 0){
        if (prev !== a-1){
          const gapStart = prev+1, gapEnd = a-1;
          if (gapStart === gapEnd) lines.push(`${gapStart} : 00000000;`);
          else                     lines.push(`[${gapStart}..${gapEnd}] : 00000000;`);
        }
        lines.push(`${a} : ${hex(v)};`);
        prev = a;
      }
    }
    if (prev < DEPTH-1){
      if (prev+1 === DEPTH-1) lines.push(`${DEPTH-1} : 00000000;`);
      else                    lines.push(`[${prev+1}..${DEPTH-1}] : 00000000;`);
    }
    lines.push('END;');
    return lines.join('\n');
  }

  genBtn.addEventListener('click', () => {
    try {
      const mif = buildMIF();
      const blob = new Blob([mif], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ramInit.mif';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      let last = slots[0];
      const summary = [];
      for (let i = 0; i < N; i++){
        const filled = slots[i].V;
        if (filled) last = slots[i];
        const src = filled ? slots[i].name : `(← from Model ${last === slots[i] ? i+1 : slots.indexOf(last)+1})`;
        summary.push(`Model ${i+1} @ word ${BASES[i]}: ${last.V.length}v ${last.F.length}t  ${filled ? src : src}`);
      }
      statusEl.textContent = 'Downloaded ramInit.mif\n' + summary.join('\n');
    } catch(err){
      statusEl.textContent = 'Error: ' + err.message;
    }
  });
</script>
</body>
</html>
